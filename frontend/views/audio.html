      <li>
        <a href="folder.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">

              d="M3.616 19.77q-.672 0-1.144-.473Q2 18.825 2 18.154V7.577q0-.213.143-.357t.357-.143t.357.143t.143.357v10.577q0 .269.173.442t.443.173H18.5q.214 0 .357.144t.143.356t-.143.357t-.357.143zm3-3q-.672 0-1.144-.473Q5 15.825 5 15.154V4.616q0-.672.472-1.144T6.616 3h4.29q.323 0 .628.13q.305.132.522.349L13.577 5h6.808q.67 0 1.143.472q.472.472.472 1.144v8.538q0 .671-.472 1.143t-1.144.472zm6.326-4.347l-1.265-1.5q-.13-.142-.313-.142t-.314.161l-1.079 1.412q-.161.212-.053.429t.357.217h7.066q.247 0 .356-.217t-.033-.43l-1.945-2.597q-.13-.162-.323-.162q-.192 0-.323.162z" />
          </svg>
          <span>Folder</span>
        </a>
      </li>
      <li>
        <a href="favorite.html">

            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"

  <main>
    <section class="top-nav">
      <span class="title-menu">Audio</span>
      <a href="#open-modal" class="button-add">
        <svg aria-hidden="true" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-width="2" stroke="#fffffff"
            d="M13.5 3H12H8C6.34315 3 5 4.34315 5 6V18C5 19.6569 6.34315 21 8 21H11M13.5 3L19 8.625M13.5 3V7.625C13.5 8.17728 13.9477 8.625 14.5 8.625H19M19 8.625V11.8125"
            stroke-linejoin="round" stroke-linecap="round"></path>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#fffffff"
            d="M17 15V18M17 21V18M17 18H14M17 18H20"></path>
        </svg>
        ADD MEDIA
      </a>
    </section>
    <section class="main-section">
      <div class="filter-container">
        <div class="filter-container-left">
          <div class="group">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon">
              <g>
                <path
                  d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z">
                </path>
              </g>
            </svg>

            <input id="query" class="input" type="search" placeholder="Search..." name="searchbar" />
          </div>
        </div>
        <div class="filter-container-right">
          <div class="mp-filter-bar">
            <div class="mp-filter-group">
              <span class="mp-filter-label">Sort by</span>
              <select class="mp-filter-select">
                <option>Name</option>
                <option>Date</option>
                <option>Size</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div id="mediaGrid" class="mp-media-grid"></div>

      <div id="mediaEmpty" class="mp-media-empty" style="display:none;">
        <div class="mp-media-empty-icon">🎬</div>
        <h3>No media found</h3>
        <p>Add Audio to see them here</p>
      </div>

    </section>
  </main>

  <div id="open-modal" class="modal-window">
    <div>
      <a href="#" title="Close" class="modal-close">Close</a>
      <h1>
        Tambah Audio Baru!
      </h1>
      <form id="form">
        <div class="input_container">
          <label class="input_label">Audio File</label>

          <div class="file_input_wrapper">
            <input type="file" id="audio_file" name="audio" accept="audio/*" class="file_input" required />
            <label for="audio_file" class="file_button">
              Pilih File audio
            </label>
            <span class="file_name" id="file_name">
              Belum ada file dipilih
            </span>
          </div>
        </div>
        <div class="input_container">
          <label class="input_label">Thumbnail Audio</label>

          <div class="file_input_wrapper">
            <input type="file" id="thumbnail_file" name="thumbnail" class="file_input" accept="image/*" required />
            <label for="thumbnail_file" class="file_button">
              Pilih Thumbnail Audio
            </label>
            <span class="file_name" id="thumbnail_name">
              Belum ada thumbnail dipilih
            </span>
          </div>
        </div>
        <div class="input_container">
          <label for="name" class="input_label">Nama Audio</label>
          <input id="name" class="input_field" type="text" name="name" title="Name" required
            placeholder="Masukan Nama Audio">
        </div>
        <div class="modal-footer">
          <a href="#" class="btn-secondary" type="button">Cancel</a>
          <button class="btn-primary" type="submit">Upload Audio</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // req input
    const fileInput = document.getElementById("audio_file");
    const fileName = document.getElementById("file_name");

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length > 0) {
        fileName.textContent = fileInput.files[0].name;
      } else {
        fileName.textContent = "Belum ada file dipilih";
      }
    });

    const thumbnailInput = document.getElementById("thumbnail_file");
    const thumbnailName = document.getElementById("thumbnail_name");

    thumbnailInput.addEventListener("change", () => {
      if (thumbnailInput.files.length > 0) {
        thumbnailName.textContent = thumbnailInput.files[0].name;
      } else {
        thumbnailName.textContent = "Belum ada thumbnail dipilih";
      }
    });

    // get data
    const mediaGrid = document.getElementById("mediaGrid");
    const mediaEmpty = document.getElementById("mediaEmpty");

    function fetchData(params) {
      fetch("http://localhost:3000/api/v1/media?type=audio")
        .then(res => res.json())
        .then(result => {
          const medias = result.data;

          if (!medias || medias.length === 0) {
            mediaGrid.style.display = "none";
            mediaEmpty.style.display = "block";
            return;
          }

          mediaEmpty.style.display = "none";
          mediaGrid.style.display = "grid";

          mediaGrid.innerHTML = medias.map(media => `
            <div class="mp-media-card" data-id="${media.id}">
              <div class="mp-media-actions">
                <button class="mp-media-more">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linecap="round"
                      stroke-linejoin="round" stroke-width="2"
                      d="M12 12h.01M8 12h.01M16 12h.01" />
                  </svg>
                </button>

                <ul class="mp-media-dropdown">
                  <li class="mp-action-move">Pindahkan ke folder</li>
                  <li class="mp-action-delete" onClick="deleteAudio(${media.id})">Hapus</li>
                </ul>
              </div>
              <a href="player.html?id=${media.id}">
                <div class="mp-media-thumb">
                  <img src="http://localhost:3000/api/v1/media/get/thumbnail/${media.id}" alt="${media.name}">
                </div>
              </a>
              <div class="mp-media-info">
                <h4 class="mp-media-title">${media.name}</h4>
                <div class="mp-media-meta-row">
                  <span class="mp-media-type ${media.type}">
                    ${media.type}
                  </span>
                  <span class="mp-media-dot">•</span>
                  <span>${formatSize(media.fileSize)}</span>
                  <span class="mp-media-dot">•</span>
                  <span>${formatDate(media.created_at)}</span>
                </div>
              </div>
            </div>
      `).join("");
        })
        .catch(err => {
          console.error(err);
          mediaGrid.style.display = "none";
          mediaEmpty.style.display = "block";
        });

    }
    fetchData()

    // post data
    const form = document.getElementById("form");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        const response = await fetch("http://localhost:3000/api/v1/media/store/audio", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Upload gagal");
        }

        alert("Upload berhasil");
        form.reset();

        window.location.hash = "";
        fetchData()
      } catch (error) {
        console.error(error);
        alert(error.message);
      }
    });


    // delete
    async function deleteAudio(id) {
      confirm("Apakah kamu yakin ingin menghapus audio ini?")
      try {
        const response = await fetch(`http://localhost:3000/api/v1/media/delete/${id}`, {
          method: "DELETE",
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "delete gagal");
        }

        alert("delete berhasil");
        fetchData()
      } catch (error) {
        console.error(error);
        alert(error.message);
      }
    }
  </script>

</body>

</html>
